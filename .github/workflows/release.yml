name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go test -race ./...
      - name: Build archives, checksums and Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run ./tools/release -version "$RELEASE_TAG"
      - name: Smoke-test the Linux release binary
        run: |
          mkdir -p dist/smoke
          tar -xzf dist/formatfast_*_linux_amd64.tar.gz -C dist/smoke
          dist/smoke/formatfast '{"message":"release\nworks"}' --extract message
          ruby -c dist/formatfast.rb
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag --draft --title "formatfast $RELEASE_TAG" --generate-notes
          dist/*.tar.gz dist/checksums.txt dist/formatfast.rb
